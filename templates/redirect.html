<!doctype html>
<html lang="en" data-mode="{{MODE}}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <script>
      try {
        const saved = localStorage.getItem("rangerverse-theme");
        document.documentElement.dataset.theme = saved === "light" || saved === "dark"
          ? saved
          : matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      } catch {}
    </script>
    <title>{{TITLE}}</title>
    <link rel="stylesheet" href="../assets/redirect.css?v={{ASSET_VERSION}}">
  </head>
  <body>
    <main>
      <span aria-hidden="true">✦</span>
      <h1>Finding a Ranger…</h1>
      <p id="message" role="status">Following the ring.</p>
      <a href="{{HOME_URL}}">Back to the directory</a>
    </main>
    <script src="../assets/redirect.js?v={{ASSET_VERSION}}"></script>
  </body>
</html>
