name: Join the Rangerverse
description: Submit a personal site for the webring
title: "Join: "
labels: [ring-application]
body:
  - type: markdown
    attributes:
      value: Thanks for sending up a flare. Share your name and site URL, plus a short description if you like. Adding ring controls to your site is optional.

  - type: input
    id: name
    attributes:
      label: Name
      placeholder: Ada
    validations:
      required: true

  - type: input
    id: url
    attributes:
      label: Site URL
      placeholder: https://ada.example
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description (optional)
      description: Keep it under 240 characters.
      placeholder: Notes, experiments, and useful little tools.
    validations:
      required: false
